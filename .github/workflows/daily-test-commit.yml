name: Daily test page commit

on:
  schedule:
    - cron: '15 8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-test-page:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update test page log
        run: node ng5-material/test/auto-commit.js

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          entry_count=$(grep -E "^- [0-9]{4}-[0-9]{2}-[0-9]{2}$" -c ng5-material/test/auto-commit-log.md || true)

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ng5-material/test/auto-commit-log.md
          git commit -m "chore(test): daily test page commit ${entry_count}/30"
          git push
